<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Drive · Going Nowhere Fast</title>
<meta name="description" content="Drive a palm-lined boulevard at sunset while Screen Door's album Going Nowhere Fast plays on the car radio.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Permanent+Marker&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  html, body { height: 100%; overflow: hidden; }
  body { background: #0e1724; color: #efe6d6; font-size: 16px; overscroll-behavior: none; }
  [hidden] { display: none !important; }
  .cond { font-weight: 900; font-stretch: 62%; text-transform: uppercase; letter-spacing: .01em; }

  .game {
    display: grid; grid-template-columns: 64fr 36fr;
    width: 100vw; height: 100vh; height: 100dvh;
  }
  .drive { position: relative; overflow: hidden; min-width: 0; min-height: 0; background: #16233a; outline: none; }
  #scene { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  .vignette {
    position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(120% 90% at 50% 40%, transparent 55%, rgba(8, 10, 18, .55) 100%);
    mix-blend-mode: multiply;
  }
  .where {
    position: absolute; top: 14px; left: 18px; margin: 0; pointer-events: none;
    font-family: var(--hand); font-size: 18px; color: #fff3df; text-shadow: 0 1px 6px rgba(0,0,0,.55);
  }

  /* the 3D cockpit is drawn in WebGL; this layer only carries the radio and the speed for screen readers */
  .dash { position: absolute; inset: 0; pointer-events: none; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  .radio {
    position: absolute; right: clamp(8px, 1.6%, 20px); top: 75.5%; width: clamp(176px, 21%, 330px);
    pointer-events: auto; z-index: 3;
    display: grid; grid-template-columns: auto minmax(0, 1fr); align-items: center; gap: 6px;
    background: linear-gradient(160deg, rgba(255,255,255,.07), rgba(255,255,255,0) 38%), #07090c;
    border: 1px solid #23272e; border-radius: 9px; padding: 7px;
    box-shadow: 0 14px 30px rgba(0,0,0,.55), inset 0 0 0 1px rgba(0,0,0,.7);
    transform: perspective(800px) rotateY(9deg); transform-origin: right center;
  }
  .radio .btns { grid-column: 1 / -1; }
  .icon {
    width: 38px; height: 38px; border-radius: 3px; display: grid; place-items: center;
    background: var(--icon-bg, #a9cbd0); color: var(--icon-fg, #13232a);
    font-size: 26px; line-height: 1; box-shadow: inset 0 0 0 1px rgba(0,0,0,.25);
  }
  .led {
    min-width: 0; background: #120a03; border-radius: 3px; padding: 4px 8px;
    color: #ffb347; text-shadow: 0 0 8px rgba(255,160,50,.6);
    box-shadow: inset 0 2px 6px rgba(0,0,0,.7);
  }
  .led-title { font-weight: 800; font-stretch: 70%; text-transform: uppercase; font-size: 15px; letter-spacing: .06em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .led-sub { font-size: 11px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: #d58c33; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .btns { display: flex; gap: 4px; justify-content: space-between; }
  .btn {
    flex: 1; min-width: 36px; height: 40px; display: grid; place-items: center; padding: 0;
    background: #181b21; color: #efe6d6; border: 1px solid #2c3039; border-radius: 4px;
    transition: background-color .15s, transform .1s;
  }
  .btn:hover { background: #2f333c; }
  .btn:active { transform: translateY(1px); }
  .btn svg { width: 20px; height: 20px; fill: currentColor; }
  .btn[aria-pressed="true"] { color: #ffb347; }
  :focus-visible { outline: 2px solid #f2a945; outline-offset: 2px; }

  /* touch */
  .touch { position: absolute; left: 0; right: 0; bottom: 98px; display: flex; justify-content: space-between; padding: 0 12px; pointer-events: none; z-index: 4; }
  .touch div { display: flex; gap: 10px; }
  .tbtn {
    pointer-events: auto; touch-action: none; user-select: none; -webkit-user-select: none;
    min-width: 60px; height: 60px; padding: 0 12px; border-radius: 4px;
    background: rgba(14, 23, 36, .62); color: #efe6d6; border: 1px solid rgba(239,230,214,.3);
    font-weight: 800; font-stretch: 70%; text-transform: uppercase; font-size: 15px; letter-spacing: .06em;
    backdrop-filter: blur(4px);
  }
  .tbtn.on { background: rgba(242,169,69,.85); color: #0e1724; }
  .tbtn svg { width: 26px; height: 26px; fill: currentColor; display: block; margin: auto; }

  /* lyrics panel */
  .panel {
    min-width: 0; min-height: 0; display: flex; flex-direction: column; overflow: hidden;
    background: linear-gradient(#111c2b, #0e1724 40%); border-left: 1px solid rgba(239,230,214,.1);
  }
  .head { padding: 22px 24px 14px; display: grid; justify-items: center; text-align: center; gap: 6px; }
  .disc { position: relative; width: clamp(110px, 24vh, 200px); aspect-ratio: 1; margin-bottom: 8px; }
  .disc::after {
    content: ''; position: absolute; inset: 0; border-radius: 50%; pointer-events: none;
    background: conic-gradient(from 30deg, transparent 0 8%, rgba(255,255,255,.08) 12%, transparent 18% 50%, rgba(255,255,255,.06) 62%, transparent 68%);
  }
  .vinyl {
    width: 100%; height: 100%; border-radius: 50%; position: relative;
    background:
      radial-gradient(circle, transparent 0 32%, #0b0b0d 32.5% 34%, transparent 34.5%),
      repeating-radial-gradient(circle, #111114 0 1.5px, #1c1c20 2px 3px),
      #111;
    box-shadow: 0 10px 30px rgba(0,0,0,.5), inset 0 0 0 2px #050506;
    animation: spin 1.8s linear infinite; animation-play-state: paused;
  }
  .vinyl.on { animation-play-state: running; }
  .label {
    position: absolute; inset: 32%; border-radius: 50%; display: grid; place-content: center; text-align: center;
    background: var(--icon-bg, #a9cbd0); color: var(--icon-fg, #13232a); line-height: 1;
  }
  .label b { font-size: clamp(18px, 4vh, 30px); font-weight: 900; font-stretch: 62%; }
  .label span { font-size: 7px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; margin-top: 2px; }
  .label::after { content: ''; position: absolute; left: 50%; top: 50%; width: 6px; height: 6px; margin: -3px; border-radius: 50%; background: #0e1724; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .vinyl { animation: none; } }
  .tt { font-size: clamp(30px, 4.4vw, 46px); line-height: .9; margin: 0; text-wrap: balance; }
  .meta { margin: 0; font-size: 14px; color: rgba(239,230,214,.72); font-weight: 600; letter-spacing: .04em; }
  .soon, .suno { grid-column: 1 / -1; width: 100%; max-width: 420px; height: 112px; border: 0; border-radius: 6px; background: #1b2240; }

  .lyrics {
    position: relative; flex: 1; min-height: 0; overflow-y: auto; padding: 22vh 28px 30vh; text-align: center;
    scrollbar-width: thin; scrollbar-color: rgba(239,230,214,.2) transparent;
    -webkit-mask-image: linear-gradient(transparent, #000 14%, #000 82%, transparent);
            mask-image: linear-gradient(transparent, #000 14%, #000 82%, transparent);
  }
  .lyrics p { margin: 0; }
  .ln { font-size: 18px; line-height: 1.45; padding: 3px 0; color: rgba(239,230,214,.62); transition: color .35s, transform .35s; }
  .ln.now { color: #f2a945; font-weight: 700; transform: scale(1.04); }
  .hd { font-size: 12px; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; color: rgba(239,230,214,.6); margin: 18px 0 6px !important; }
  .gap { height: 8px; }
  .note { font-size: 17px; line-height: 1.55; color: #efe6d6; max-width: 34ch; margin: 0 auto !important; }

  /* start overlay */
  .start {
    position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; padding: 24px;
    background: radial-gradient(80% 70% at 50% 45%, rgba(14,23,36,.72), rgba(14,23,36,.94));
    backdrop-filter: blur(3px);
  }
  .start-in { max-width: 640px; text-align: center; display: grid; justify-items: center; gap: 14px; }
  .kicker { margin: 0; font-family: var(--hand); color: #f2a945; font-size: 22px; transform: rotate(-2deg); }
  .start h2 { margin: 0; font-size: clamp(54px, 11vw, 132px); line-height: .84; color: #efe6d6; }
  .lead { margin: 0; font-size: 19px; color: rgba(239,230,214,.86); }
  .keys { list-style: none; padding: 0; margin: 4px 0 6px; display: flex; flex-wrap: wrap; justify-content: center; gap: 8px 18px; font-size: 14px; color: rgba(239,230,214,.75); }
  .keys b { color: #efe6d6; font-weight: 700; }
  .go {
    margin-top: 6px; border: 0; border-radius: 4px; padding: 16px 30px; min-height: 52px;
    background: #f2a945; color: #0e1724; font-size: 22px; letter-spacing: .04em;
    box-shadow: 0 8px 24px rgba(242,169,69,.25); transition: transform .15s, background-color .15s;
  }
  .go:hover { background: #ffbd5e; transform: translateY(-1px); }

  @media (max-width: 759px), (orientation: portrait) {
    .game { grid-template-columns: 1fr; grid-template-rows: 58fr 42fr; }
    .panel { border-left: 0; border-top: 1px solid rgba(239,230,214,.1); }
    .head { grid-template-columns: auto 1fr; justify-items: start; text-align: left; column-gap: 16px; row-gap: 2px; padding: 14px 18px 8px; align-items: center; }
    .disc { grid-row: span 3; width: clamp(72px, 11vh, 110px); margin: 0; }
    .tt { font-size: 30px; }
    .lyrics { padding: 12vh 20px 18vh; }
    .ln { font-size: 17px; }
    .where { top: 8px; left: 12px; font-size: 15px; }
    .touch { bottom: 8px; }
    .radio { top: 34px; bottom: auto; left: 6px; right: 6px; width: auto; transform: none; grid-template-columns: auto minmax(0, 1fr) auto; padding: 5px; }
    .radio .btns { grid-column: auto; }
    .btn { flex: 0 0 38px; height: 38px; }
    .icon { width: 34px; height: 34px; font-size: 23px; }
    .led-title { font-size: 14px; }
    .tbtn { min-width: 54px; height: 54px; }
  }
</style>
</head>
<body data-light="night">
<main class="game" id="game" tabindex="-1">
  <section class="drive" id="drive" aria-label="Driving view. Use arrow keys or W A S D to drive">
    <canvas id="scene" aria-hidden="true"></canvas>
    <div class="vignette"></div>
    <p class="where" id="where">Afternoon · Tracks 1–3</p>

    <div class="touch" id="touch" hidden>
      <div>
        <button class="tbtn" data-key="left" aria-label="Steer left"><svg viewBox="0 0 24 24"><path d="M15 4 7 12l8 8z"/></svg></button>
        <button class="tbtn" data-key="right" aria-label="Steer right"><svg viewBox="0 0 24 24"><path d="m9 4 8 8-8 8z"/></svg></button>
      </div>
      <div>
        <button class="tbtn" data-key="down" aria-label="Brake and reverse">Brake</button>
        <button class="tbtn" data-key="up" aria-label="Accelerate">Gas</button>
      </div>
    </div>

    <div class="dash">
      <p class="sr" aria-live="off"><span id="speed">0</span> mph</p>
      <div class="radio" role="group" aria-label="Car radio">
        <div class="icon cond" id="icon" aria-hidden="true">01</div>
        <div class="led" aria-live="polite">
          <div class="led-title" id="ledTitle">01 Tape Hiss (Intro)</div>
          <div class="led-sub" id="ledSub">Side A · 0:00 / 2:58</div>
        </div>
        <div class="btns">
          <button class="btn" id="prev" aria-label="Previous track (Q)"><svg viewBox="0 0 24 24"><path d="M5 5h2.5v14H5zM20 5v14L8.5 12z"/></svg></button>
          <button class="btn" id="play" aria-label="Play (Space)" aria-pressed="false"><svg viewBox="0 0 24 24"><path id="playIcon" d="M7 5v14l12-7z"/></svg></button>
          <button class="btn" id="next" aria-label="Next track (E)"><svg viewBox="0 0 24 24"><path d="M16.5 5H19v14h-2.5zM4 5v14l11.5-7z"/></svg></button>
          <button class="btn" id="mute" aria-label="Mute" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M3 9h4l5-4v14l-5-4H3z"/><path id="muteIcon" d="M15.5 8.5a5 5 0 0 1 0 7M18 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
        </div>
      </div>
    </div>
  </section>

  <aside class="panel" aria-label="Lyrics">
    <div class="head">
      <div class="disc"><div class="vinyl" id="vinyl"><div class="label"><b id="vnum">01</b><span>Screen Door</span></div></div></div>
      <h1 class="tt cond" id="title">Tape Hiss (Intro)</h1>
      <p class="meta" id="meta"></p>
      <iframe class="suno" id="soon" hidden title="Song player (Suno)" allow="autoplay; encrypted-media"></iframe>
    </div>
    <div class="lyrics" id="lyrics"></div>
  </aside>
</main>

<div class="start" id="start" role="dialog" aria-modal="true" aria-labelledby="startTitle">
  <div class="start-in">
    <p class="kicker">Screen Door</p>
    <h2 class="cond" id="startTitle">Going Nowhere Fast</h2>
    <p class="lead">Drive through town while the album plays.</p>
    <ul class="keys">
      <li><b>W A S D</b> or <b>arrows</b> to drive</li>
      <li><b>Q</b> / <b>E</b> change track</li>
      <li><b>Space</b> play / pause</li>
    </ul>
    <button class="go cond" id="go">Turn the key</button>
  </div>
</div>

<script src="data.js"></script>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module" src="drive.js"></script>
</body>
</html>

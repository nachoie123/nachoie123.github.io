<title>Página no encontrada · Nacho San Benito</title>
<script>
  // GitHub Pages distingue mayúsculas: /Mesta da 404 y /mesta funciona. Probamos la versión en minúsculas.
  var p = location.pathname, l = p.toLowerCase();
  if (l !== p) location.replace(l + location.search + location.hash);
</script>

  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0b0b0c; color: #eee; font: 16px/1.5 -apple-system, system-ui, sans-serif; }
  a { color: #fff; }
</style>
</head>

</body>

<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<title>Volver a Pressed</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; box-sizing: border-box;
         font: 17px/1.4 -apple-system, system-ui, sans-serif; text-align: center; color: #111; background: #fff; }
  a { color: #2445D6; font-weight: 600; }
  @media (prefers-color-scheme: dark) { body { color: #f2f2f2; background: #000; } a { color: #8FA2FF; } }
</style>
</head>
<body>
<main>
  <p>Volviendo a Pressed…</p>
  <p><a id="volver" href="pressed://conectar">Abrir Pressed</a></p>
</main>
<script>
// OpenRouter vuelve aquí con ?code=…&state=… y Pressed lo recoge en pressed://conectar (ConectarIAView). Solo pasan
// esos parámetros; nada se guarda ni se envía a ningún sitio.
(function () {
  var q = new URLSearchParams(location.search), d = new URLSearchParams();
  ["code", "state", "error"].forEach(function (k) { if (q.has(k)) d.set(k, q.get(k)); });
  var destino = "pressed://conectar?" + d.toString();
  document.getElementById("volver").href = destino;
  location.replace(destino);
})();
</script>
</body>
</html>
